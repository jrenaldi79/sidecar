<!DOCTYPE html>
<html lang="en" data-height="520" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="sidecar-app">
  <div id="sidecar-header">
    <div class="header-brand">
      <div class="status-dot" id="status-dot"></div>
      <span class="brand-name">Sidecar</span>
    </div>
    <span id="model-badge"></span>
    <div class="header-meta">
      <span id="task-id-display"></span>
      <span id="timer">0:00</span>
    </div>
  </div>

  <div id="messages-container">
    <div id="loading-indicator">
      <div class="loading-spinner"></div>
      <span class="loading-text">Connecting to sidecar...</span>
      <span class="loading-sub">Waiting for model to initialize</span>
    </div>
  </div>

  <div id="fold-overlay">
    <div class="fold-spinner"></div>
    <div class="fold-status" id="fold-status-text">Generating summary...</div>
    <div class="fold-sub">Compressing conversation for Claude</div>
  </div>

  <div id="sidecar-toolbar">
    <input type="text" id="chat-input" placeholder="Send a message..." autocomplete="off">
    <button id="send-btn">&uarr;</button>
    <button id="fold-btn">Fold</button>
  </div>
</div>
<script type="module" src="./mcp-app.js"></script>
</body>
</html>
